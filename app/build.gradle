plugins { id 'com.android.application' }

android {
    namespace 'jp.reader.manga'
    compileSdk 35
    signingConfigs {
        stable {
            def keyPath = System.getenv('MANGA_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('MANGA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MANGA_KEY_ALIAS')
                keyPassword System.getenv('MANGA_KEYSTORE_PASSWORD')
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('MANGA_KEYSTORE_PATH')) signingConfig signingConfigs.stable
        }
        release {
            if (System.getenv('MANGA_KEYSTORE_PATH')) signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }
    defaultConfig {
        applicationId 'jp.reader.manga'
        minSdk 26
        targetSdk 35
        def ciRun = System.getenv('GITHUB_RUN_NUMBER')
        versionCode ciRun ? 1000 + Integer.parseInt(ciRun) : 1
        versionName ciRun ? "0.1.${ciRun}" : '0.1.0-local'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
