name: Performance pre-release check
on:
  push:
    branches: [perf-safety]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: JVM tests
        run: ./tests/run-jvm-tests.sh
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MANGA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Signing key unavailable"; exit 1; fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/manga-signing.p12"
      - name: Build signed test APK without publishing a release
        env:
          MANGA_KEYSTORE_PATH: ${{ runner.temp }}/manga-signing.p12
          MANGA_KEYSTORE_PASSWORD: ${{ secrets.MANGA_KEYSTORE_PASSWORD }}
          MANGA_KEY_ALIAS: ${{ secrets.MANGA_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Match the next Android workflow's version so the normal future update can replace this build.
          next=$(gh api 'repos/kya1422/MangaReader/actions/workflows/android.yml/runs?branch=main&per_page=1' --jq '.workflow_runs[0].run_number + 1')
          GITHUB_RUN_NUMBER="$next" gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Upload test APK (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: manga-reader-performance-test
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/manga-signing.p12"
