name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run JVM smoke tests
        run: ./tests/run-jvm-tests.sh
      - name: Prepare stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MANGA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MANGA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MANGA_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Signing secrets are missing. Configure MANGA_KEYSTORE_BASE64, MANGA_KEYSTORE_PASSWORD and MANGA_KEY_ALIAS in repository Actions secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/manga-signing.p12"
      - name: Build release APK with stable signature
        env:
          MANGA_KEYSTORE_PATH: ${{ runner.temp }}/manga-signing.p12
          MANGA_KEYSTORE_PASSWORD: ${{ secrets.MANGA_KEYSTORE_PASSWORD }}
          MANGA_KEY_ALIAS: ${{ secrets.MANGA_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Check APK does not request package installation permission
        run: |
          permissions=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/release/app-release.apk)
          if printf '%s\n' "$permissions" | grep -F 'android.permission.REQUEST_INSTALL_PACKAGES'; then
            echo "Unexpected package installation permission found"
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-reader-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish signed APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MangaReader.apk"
          tag="build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/MangaReader.apk" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/MangaReader.apk" --target "$GITHUB_SHA" --title "MangaReader 0.1.${GITHUB_RUN_NUMBER}" --notes "Signed APK. Build ${GITHUB_RUN_NUMBER}." --latest
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/manga-signing.p12"
